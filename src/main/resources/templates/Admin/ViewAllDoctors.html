<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View All Doctors</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .doctor-table {
            margin-top: 20px;
        }
        .header {
            background-color: #f8f9fa;
            padding: 20px 0;
            margin-bottom: 30px;
            border-bottom: 1px solid #dee2e6;
        }
        .status-active {
            color: green;
            font-weight: bold;
        }
        .status-inactive {
            color: red;
            font-weight: bold;
        }
        .empty-data {
            text-align: center;
            padding: 50px;
            color: #6c757d;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
<div class="header">
    <div class="container">
        <h1>Doctor Management</h1>
        <p class="lead">View and manage all registered doctors</p>
    </div>
</div>

<div class="container">
    <div class="row mb-3">
        <div class="col-md-6">
            <input type="text" class="form-control" id="searchInput" placeholder="Search doctors...">
        </div>
    </div>

    <div class="table-responsive doctor-table">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Contact</th>
                <th>Email</th>
                <th>Specialization</th>
                <th>Hospital</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <!-- Check if doctors list is empty -->
            <tr th:if="${doctors.empty}">
                <td colspan="8" class="empty-data">No doctor data available</td>
            </tr>
            <!-- Display doctors if list is not empty -->
            <tr th:each="doctor : ${doctors}" th:unless="${doctors.empty}">
                <td th:text="${doctor.unique_id}"></td>
                <td>
                    <span th:text="${doctor.first_name + ' ' + doctor.last_name}"></span>
                </td>
                <td th:text="${doctor.contact_number}"></td>
                <td th:text="${doctor.email}"></td>
                <td>
                    <span th:text="${doctor.specialist}"></span>
                    <span th:if="${doctor.other_specialization}"
                          th:text="' (' + ${doctor.other_specialization} + ')'"></span>
                </td>
                <td th:text="${doctor.government_hospital}"></td>
                <td>
                    <!-- Check if status is 1 (active) or something else (inactive) -->
                    <span th:class="${doctor.status == 1 ? 'status-active' : 'status-inactive'}"
                          th:text="${doctor.status == 1} ? 'Active' : 'Inactive'"></span>
                </td>
                <td>
                    <button class="btn btn-sm btn-primary">View</button>
                    <button class="btn btn-sm btn-warning">Edit</button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Simple search functionality
    document.getElementById('searchInput').addEventListener('keyup', function() {
        const input = this.value.toLowerCase();
        const rows = document.querySelectorAll('tbody tr');
        let hasVisibleRows = false;

        rows.forEach(row => {
            // Skip the "no data" row if it exists
            if (row.classList.contains('empty-data')) {
                return;
            }

            const text = row.textContent.toLowerCase();
            if (text.includes(input)) {
                row.style.display = '';
                hasVisibleRows = true;
            } else {
                row.style.display = 'none';
            }
        });

        // Show "no data" message if no rows match the search
        const emptyDataRow = document.querySelector('.empty-data');
        if (emptyDataRow) {
            emptyDataRow.style.display = hasVisibleRows ? 'none' : '';
        }
    });
</script>
</body>
</html>
