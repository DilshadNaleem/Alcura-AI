<section class="home">
    <div class="text">Dashboard</div>
    <div id="chatContainer">
        <h1>OLLaMA Chat</h1>
        <input type="text" id="promptInput" placeholder="Type your message..." autocomplete="off">
        <button id="submitBtn">Send</button>
        <div id="responseControls">
            <button id="speakBtn" disabled>🔊 Speak</button>
            <button id="stopSpeakBtn" disabled>⏹ Stop</button>
        </div>
        <div id="responseArea"></div>
    </div>

<script src="/Customer/script.js"></script>>
<script>
    const promptInput = document.getElementById('promptInput');
    const responseArea = document.getElementById('responseArea');
    const submitBtn = document.getElementById('submitBtn');
    const speakBtn = document.getElementById('speakBtn');
    const stopSpeakBtn = document.getElementById('stopSpeakBtn');

    let eventSource = null;
    let isStreaming = false;
    let tokenBuffer = "";
    let speechSynthesis = window.speechSynthesis;
    let currentUtterance = null;

    function speakText() {
        if (speechSynthesis.speaking) {
            speechSynthesis.cancel();
        }

        const text = responseArea.textContent;
        if (!text) return;

        currentUtterance = new SpeechSynthesisUtterance(text);
        currentUtterance.onend = () => {
            speakBtn.disabled = false;
            stopSpeakBtn.disabled = true;
        };

        speechSynthesis.speak(currentUtterance);
        speakBtn.disabled = true;
        stopSpeakBtn.disabled = false;
    }



    function stopSpeaking() {
        if (speechSynthesis.speaking) {
            speechSynthesis.cancel();
        }
        speakBtn.disabled = false;
        stopSpeakBtn.disabled = true;
    }

    speakBtn.addEventListener('click', speakText);
    stopSpeakBtn.addEventListener('click', stopSpeaking);

    function startStream() {
        const prompt = promptInput.value.trim();
        if (!prompt || isStreaming) return;

        responseArea.textContent = '';
        tokenBuffer = '';
        isStreaming = true;
        submitBtn.disabled = true;
        speakBtn.disabled = true;
        stopSpeakBtn.disabled = true;

        eventSource = new EventSource(`/api/chat/stream?prompt=${encodeURIComponent(prompt)}`);

        eventSource.onmessage = (event) => {
            const currentToken = event.data;

            if (tokenBuffer) {
                tokenBuffer += " " + currentToken;
            } else {
                tokenBuffer = currentToken;
            }

            responseArea.textContent = tokenBuffer;
        };

        eventSource.onerror = () => {
            isStreaming = false;
            submitBtn.disabled = false;
            speakBtn.disabled = false;
            eventSource.close();
        };
    }

    submitBtn.addEventListener('click', startStream);
    promptInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') startStream();
    });
</script>
