<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login Form</title>
    <link rel="stylesheet" href="/Customer/Signing.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.14.0/css/all.min.css">
    <style>
        .password-container {
            position: relative;
            width: 100%;
        }
        .password-container input {
            width: 100%;
            padding-right: 40px;
            box-sizing: border-box;
        }
        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #aaa;
        }
        .toggle-password:hover {
            color: #333;
        }
        /* Voice control styling */
        .voice-control {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background-color: #ff4444;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            transition: all 0.3s ease;
        }
        .voice-control:hover {
            transform: scale(1.1);
        }
        .voice-control.listening {
            background-color: #4CAF50;
            animation: pulse 1.5s infinite;
        }
        .voice-control i {
            color: white;
            font-size: 24px;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="container" id="container">
    <div class="form-container sign-up-container" >
        <form action="/Alcura/CustomerRegister" id="signupForm" method="post">
            <h1>Create Account</h1> <br />
            <div class="social-container">
                <a href="#" class="social"><i class="fab fa-facebook"></i> </a>
                <a href="#" class="social"><i class="fab fa-google-plus-g"></i> </a>
                <a href="#" class="social"><i class="fab fa-linkedin-in"></i> </a>
            </div>

            <input type="text" id="firstName" name="firstname" placeholder="Enter your First Name" required>
            <input type="text" id="lastName" name="lastname" placeholder="Enter your Last Name" required>
            <input type="email" id="email" name="email" placeholder="Enter your Email" required>

            <div class="password-container">
                <input type="password" id="newpassword" name="password" placeholder="Enter Password" required>
                <i class="toggle-password fas fa-eye" id="toggleNewPassword"></i>
            </div>

            <div class="password-container">
                <input type="password" id="confirmPassword" name="confirmpassword" placeholder="Confirm Password" required>
                <i class="toggle-password fas fa-eye" id="toggleConfirmPassword"></i>
            </div>

            <input type="text" name="contact_number" id="contactNumber" placeholder="Contact Number" required>
            <input type="text" id="nic" name="nic" placeholder="Enter NIC" required>

            <button type="submit" name="register" value="register">Sign Up</button>
        </form>
    </div>


    <!-- Signin Container-->
    <div class="form-container sign-in-container">
        <form action="/Customer/Login" id="signinForm" method="post">
            <h1>Sign In</h1> <br>
            <div class="social-container">
                <a href="#" class="social"><i class="fab fa-facebook"></i></a>
                <a href="#" class="social"><i class="fab fa-google-plus-g"></i></a>
                <a href="#" class="social"><i class="fab fa-linkedin-in"></i></a>
            </div>
            <span>or Use your Registered Account</span>
            <input type="email" id="signinEmail" name="email" placeholder="Eneter your Email" required>

            <div class="password-container">
                <input type="password" name="signinPassword" id="password" placeholder="Enter your Password" required>
                <i class="toggle-password fas fa-eye" id="toggleSignInPassword"></i>
            </div>

            <button type="submit">Sign In</button>
            <a href="/Customer/recover_psw.html">Reset Password</a>
            <a href="/Customer/FaceLogin">Login with Face</a>
            <a href="/Customer/SOS">SOS</a>
        </form>
    </div>

    <!--Overlay Container-->
    <div class="overlay-container">
        <div class="overlay">
            <div class="overlay-panel overlay-left">
                <h1>Welcome Back!</h1> <br>
                <p>To keep Connected with our services Plese Login with credentials</p> <br>
                <button class="ghost" id="signIn">Sign In</button>
            </div>

            <div class="overlay-panel overlay-right">
                <h1>Hello!</h1> <br>
                <p>Enter your personal details to Register</p> <br>
                <button class="ghost" id="signUp">Sign Up</button>
            </div>
        </div>
    </div>
</div>

<div class="voice-control" id="voiceControl" title="Click to speak">
    <i class="fas fa-microphone"></i>
</div>

<footer>
    <p>Brought to you by
        <a href="Https://Aclura-Health.com" target="_blank">Alcura AI Platform</a>
        - Your AI Health Care Platform
    </p>
</footer>
<script src="/Customer/Signing.js"></script>
<script>
    // Add show/hide password functionality
 document.addEventListener('DOMContentLoaded', function() {
     // Toggle for new password in sign-up form
     const toggleNewPassword = document.getElementById('toggleNewPassword');
     const newPassword = document.getElementById('newpassword');

     toggleNewPassword.addEventListener('click', function() {
         const type = newPassword.getAttribute('type') === 'password' ? 'text' : 'password';
         newPassword.setAttribute('type', type);
         this.classList.toggle('fa-eye');
         this.classList.toggle('fa-eye-slash');
     });

     // Toggle for confirm password in sign-up form
     const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');
     const confirmPassword = document.getElementById('confirmPassword');

     toggleConfirmPassword.addEventListener('click', function() {
         const type = confirmPassword.getAttribute('type') === 'password' ? 'text' : 'password';
         confirmPassword.setAttribute('type', type);
         this.classList.toggle('fa-eye');
         this.classList.toggle('fa-eye-slash');
     });

     // Toggle for password in sign-in form
     const toggleSignInPassword = document.getElementById('toggleSignInPassword');
     const signInPassword = document.getElementById('password');

     toggleSignInPassword.addEventListener('click', function() {
         const type = signInPassword.getAttribute('type') === 'password' ? 'text' : 'password';
         signInPassword.setAttribute('type', type);
         this.classList.toggle('fa-eye');
         this.classList.toggle('fa-eye-slash');
     });

     // Voice recognition functionality
     const voiceControl = document.getElementById('voiceControl');
     let recognition = null;

     // Check if the browser supports the Web Speech API
     if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
         recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
         recognition.continuous = false;
         recognition.lang = 'en-US';
         recognition.interimResults = false;
         recognition.maxAlternatives = 1;

         recognition.onstart = function() {
             voiceControl.classList.add('listening');
             voiceControl.title = "Listening...";
         };

         recognition.onresult = function(event) {
             const transcript = event.results[0][0].transcript.toLowerCase().trim();
             console.log('Voice command:', transcript);

             if (transcript.includes('send sos')) {
                 // Redirect to SOS page with voice parameter
                 window.location.href = '/Customer/SOS?voice=true';
             }
         };

         recognition.onerror = function(event) {
             console.error('Speech recognition error', event.error);
             voiceControl.classList.remove('listening');
             voiceControl.title = "Click to speak";
         };

         recognition.onend = function() {
             voiceControl.classList.remove('listening');
             voiceControl.title = "Click to speak";
         };

         voiceControl.addEventListener('click', function() {
             try {
                 recognition.start();
             } catch (error) {
                 console.error('Speech recognition failed to start:', error);
             }
         });
     } else {
         // Browser doesn't support speech recognition
         voiceControl.style.display = 'none';
         console.warn('Speech recognition not supported in this browser');
     }
 });
</script>
</body>
</html>
