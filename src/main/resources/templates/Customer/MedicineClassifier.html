<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Medicine Classifier Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Arial', sans-serif;
        }
        .container {
            max-width: 1200px;
            margin-top: 20px;
        }
        .card {
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        .card-header {
            background-color: #007bff;
            color: white;
            border-radius: 10px 10px 0 0 !important;
        }
        .preview-image {
            max-width: 100%;
            max-height: 400px;
            margin: 0 auto;
            display: block;
        }
        .tab-content {
            min-height: 200px;
        }
        .status-bar {
            font-size: 0.9rem;
            color: #6c757d;
        }
        .result-text {
            font-weight: bold;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

<nav class="sidebar close">
    <header>
        <div class="image-text">
                    <span class="image">
                        <img src="log.png" alt="">
                    </span>

            <div class="text header-text">
                <span class="name">Alucra</span>
                <span class="profession">Web developer</span>
            </div>
        </div>

        <i class='bx bx-chevron-right toggle'></i>
    </header>

    <div class="menu-bar">
        <div class="menu">
            <li class="search-box">
                <i class='bx bx-search icon' ></i>
                <input type="search" placeholder="Search" id="searchBox">
            </li>


            <ul class="menu-links">

                <li class="nav-link">
                    <a href="/Customer/Dashboard">
                        <i class='bx bx-home-alt icon' ></i>
                        <span class="text nav-text">Dashboard</span>
                    </a>
                </li>

                <li class="nav-link">
                    <a href="/Customer/editProfile">
                        <i class='bx bx-user icon' ></i>
                        <span class="text nav-text">Edit profile</span>
                    </a>
                </li>

                <li class="nav-link">
                    <a href="/Customer/Model">
                        <i class='bx bx-cube icon' ></i>
                        <span class="text nav-text">Model</span>
                    </a>
                </li>
                <li class="nav-link">
                    <a href="/Customer/FaceEnrollment">
                        <i class='bx bx-face icon' ></i>
                        <span class="text nav-text">Face</span>
                    </a>
                </li>
                <li class="nav-link">
                    <a href="/Customer/SOS">
                        <i class='bx bx-first-aid icon' ></i>
                        <span class="text nav-text">SOS</span>
                    </a>
                </li>
                <li class="nav-link">
                    <a href="/Customer/MedicineClassifier">
                        <i class='bx bx-capsule icon' ></i>
                        <span class="text nav-text">Drug</span>
                    </a>
                </li>
                <li class="nav-link">
                    <a href="/Customer/DiseaseClassifier">
                        <i class='bx bx-bug icon' ></i>
                        <span class="text nav-text">Disease</span>
                    </a>
                </li>
                <li class="nav-link">
                    <a href="/Customer/DiseaseSymptomChecker">
                        <i class="bx bx-clinic icon"></i>
                        <span class="text nav-text">Diseae Symptom</span>
                    </a>
                </li>

                <li class="nav-link">
                    <a href="/Customer/AppointmentBooking">
                        <i class="bx bx-calendar icon"></i>
                        <span class="text nav-text">Appointment Bookings</span>
                    </a>
                </li>

            </ul>
        </div>
        <div class="bottom-content">
            <li class="">
                <a href="#">
                    <i class='bx bx-log-out icon' ></i>
                    <span class="text nav-text">Logout</span>
                </a>
            </li>

            <li class="mode">
                <div class="moon-sun">
                    <i class='bx bx-moon icon moon' ></i>
                    <i class='bx bx-sun icon sun' ></i>
                </div>

                <span class="mode-text text">Dark Mode</span>
                <div class="toggle-switch">
                    <span class="switch"></span>
                </div>
            </li>
        </div>
    </div>
</nav>


<section class="home">
<div class="container">
    <h1 class="text-center my-4">Medicine Classifier Pro</h1>

    <div class="row">
        <!-- Left Panel -->
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h5>Upload Medicine Image</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/Customer/MedicineClassifier}" method="post" enctype="multipart/form-data">
                        <div class="mb-3 text-center">
                            <img th:if="${imagePreview != null}" th:src="${imagePreview}"
                                 class="preview-image img-thumbnail" alt="Preview">
                            <img th:unless="${imagePreview != null}" src="placeholder.jpg"
                                 class="preview-image img-thumbnail" alt="Preview">
                        </div>
                        <div class="mb-3">
                            <input type="file" name="file" class="form-control" accept="image/*" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Classify Medicine</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Right Panel -->
        <div class="col-md-6">
            <div class="card">

                <script th:if="${result != null}">
                    alert("Classification Results");
                </script>


                <div class="card-body">
                    <div th:if="${result != null}">
                        <p class="result-text" th:text="'Predicted Medicine: ' + ${result.predictedClass}"></p>
                        <p class="text-muted" th:text="'Confidence: ' + ${#numbers.formatDecimal(result.confidence, 1, 2)} + '%'"></p>

                        <ul class="nav nav-tabs" id="infoTabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#details">Details</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#dosage">Dosage</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#usage">Usage</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#effects">Side Effects</button>
                            </li>
                        </ul>

                        <div class="tab-content p-3 border border-top-0 rounded-bottom">
                            <div class="tab-pane fade show active" id="details">
                                <p th:text="'Name: ' + ${result.drugInfo.className}"></p>
                                <p th:text="'Dosage Form: ' + ${result.drugInfo.dosageForm}"></p>
                                <p th:text="'Price: ' + ${result.drugInfo.price}"></p>
                                <p th:text="'Price: ' + ${result.drugInfo.scientificname}"></p>
                            </div>
                            <div class="tab-pane fade" id="dosage">
                                <p th:text="'Standard Dosage: ' + ${result.drugInfo.dosage}"></p>
                                <p th:text="'Max Daily Dose: ' + ${result.drugInfo.maxDose}"></p>
                                <p th:text="'Administration: ' + ${result.drugInfo.administration}"></p>
                            </div>
                            <div class="tab-pane fade" id="usage">
                                <p th:text="'Primary Use: ' + ${result.drugInfo.use}"></p>
                                <p th:text="'Indications: ' + ${result.drugInfo.indications}"></p>
                                <p th:text="'Precautions: ' + ${result.drugInfo.precautions}"></p>
                            </div>
                            <div class="tab-pane fade" id="effects">
                                <p th:text="'Common Side Effects: ' + ${result.drugInfo.sideEffects}"></p>
                                <p th:text="'Serious Side Effects: ' + ${result.drugInfo.seriousEffects}"></p>
                                <p th:text="'Contraindications: ' + ${result.drugInfo.contraindications}"></p>
                            </div>
                        </div>
                    </div>
                    <div th:unless="${result != null}">
                        <p class="lead">No medicine classified yet</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="status-bar mt-3 p-2 bg-light rounded">
        <span th:text="${status != null} ? ${status} : 'Ready'"></span>
    </div>
</div>
</section>
<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
