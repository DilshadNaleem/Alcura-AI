<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Disease Classifier</title>
    <link rel="stylesheet" href="style.css">
    <!---Boxicon css-->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Arial', sans-serif;
        }
        .container {
            max-width: 1200px;
            margin-top: 20px;
            margin: 0 auto;
            padding: 20px;
        }
        .card {
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            padding: 25px;
            margin: 0 auto;
            max-width: 100%;
        }
          .home {
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-height: calc(100vh - 60px); /* Account for navbar height */
        padding: 20px;
        box-sizing: border-box;
    }
        .card-header {
            background-color: #007bff;
            color: white;
            border-radius: 10px 10px 0 0 !important;
        }
        .preview-image {
            max-width: 100%;
            max-height: 400px;
            margin: 0 auto;
            display: block;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            padding: 5px;
            background: white;
        }
        .preview-container {
            display: none; /* Initially hidden */
        }
        .tab-content {
            min-height: 200px;
            padding: 20px;
            margin-top: 15px;
        }
        .status-bar {
            font-size: 0.9rem;
            color: #6c757d;
        }
        .result-text {
            font-weight: bold;
            font-size: 1.2rem;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            padding: 15px;
        }
        .form-control {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ced4da;
            transition: border-color 0.3s ease;
        }
        .form-control:focus {
            border-color: #86b7fe;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }
        .btn-primary {
            padding: 12px;
            border-radius: 8px;
            font-weight: 500;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        /* Dark Mode Styles */
        body.dark {
            background-color: #18191A;
        }
        body.dark .container {
            background-color: #242526;
        }
        body.dark .card {
            background-color: #242526;
            color: #CCC;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        body.dark .card-header {
            background-color: #3A3B3C;
            color: #CCC;
        }
        body.dark .preview-image {
            background-color: #3A3B3C;
            border-color: #444;
        }
        body.dark .tab-content {
            background-color: #3A3B3C;
            color: #CCC;
        }
        body.dark .status-bar {
            background-color: #3A3B3C;
            color: #CCC;
        }
        body.dark .form-control {
            background-color: #3A3B3C;
            border-color: #444;
            color: #CCC;
        }
        body.dark .form-control:focus {
            border-color: #695CFE;
            box-shadow: 0 0 0 0.25rem rgba(105, 92, 254, 0.25);
        }
        body.dark .btn-primary {
            background-color: #695CFE;
            border-color: #695CFE;
        }
        body.dark .result-text,
        body.dark h1,
        body.dark h5 {
            color: #CCC;
        }
        body.dark .text-muted {
            color: #b3b3b3 !important;
        }
        body.dark .nav-tabs .nav-link.active {
            background-color: #3A3B3C;
            color: #CCC;
        }
        body.dark .nav-tabs .nav-link:not(.active) {
            color: #b3b3b3;
        }
        body.dark .border {
            border-color: #3A3B3C !important;
        }

        @media (max-width: 768px) {
            .card {
                padding: 15px;
            }
            form {
                gap: 1rem;
            }
            .preview-image {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

                    </span>

                <span class="name">Alucra</span>

            </div>
        </div>

        <i class='bx bx-chevron-right toggle'></i>
    </header>

    <div class="menu-bar">

            <ul class="menu-links">

                </li>

                <li class="nav-link">
                    <a href="/Customer/editProfile">

                </li>

                <li class="nav-link">
                    <a href="/Customer/Model">
                        <i class='bx bx-cube icon' ></i>

                    </a>
                </li>
                <li class="nav-link">
                    <a href="/Customer/FaceEnrollment">
                        <i class='bx bx-face icon' ></i>

                    </a>
                </li>
                <li class="nav-link">
                    <a href="/Customer/SOS">

                    </a>
                </li>
                <li class="nav-link">
                    <a href="/Customer/MedicineClassifier">

                    </a>
                </li>
                <li class="nav-link">
                    <a href="/Customer/DiseaseClassifier">
                        <i class='bx bx-bug icon' ></i>

                    </a>
                </li>
                <li class="nav-link">
                    <a href="/Customer/DiseaseSymptomChecker">
                        <i class="bx bx-clinic icon"></i>

                    </a>

                <li class="nav-link">

                </li>

            </ul>
        </div>
        <div class="bottom-content">

            <li class="mode">
                <div class="moon-sun">

</nav>

<section class="home">
    <div class="container">
        <h1 class="text-center">Disease Classifier</h1>
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Upload Disease Image</h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/Customer/DiseaseClassifier}" method="post" enctype="multipart/form-data" id="uploadForm">
                            <div class="mb-3 text-center preview-container" id="previewContainer">
                                <img th:if="${imagePreview != null}" th:src="${imagePreview}"
                                     class="preview-image img-thumbnail" alt="Preview">

                                <img th:unless="${imagePreview != null}" src="placeholder.jpg" alt="Preview"
                                     class="preview-image img-thumbnail" id="previewImage">
                            </div>

                            <div class="mb-3">
                                <input type="file" name="file" class="form-control" accept="image/*" required id="fileInput">
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Classify Disease</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card">
                    <script th:if="${result != null}">
                        alert('Classification Results');
                    </script>

                    <div class="card-body">
                        <div th:if="${result != null}">
                            <p class="result-text" th:text="'Predicted Disease: ' + ${result.predictedClass}"></p>
                            <p class="text-muted" th:text="'Confidence: ' + ${#numbers.formatDecimal(result.confidence, 1,2)} + '%'"></p>

                            <ul class="nav nav-tabs" id="infoTabs" role="tablist">
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#details">Details</button>
                                </li>

                                <li class="nav-item" role="presentation">
                                    <button class="nav-link" data-bs-toggle="tab" data-bs-target="#dosage">Dosage</button>
                                </li>

                            </ul>

                            <div class="tab-content p-3 border border-top-0 rounded-bottom">
                                <div class="tab-pane fade show active" id="details">
                                    <p th:text="'Disease: ' + ${result.diseaseInfo.disease}"></p>
                                    <p th:text="'Description: ' + ${result.diseaseInfo.description}"></p>
                                    <p th:text="'Symptoms: ' + ${result.diseaseInfo.symptoms}"></p>
                                    <p th:text="'Cause: ' + ${result.diseaseInfo.cause}"></p>
                                    <p th:text="'Side Effects: ' + ${result.diseaseInfo.sideeffects}"></p>
                                    <p th:text="'Treatment: ' + ${result.diseaseInfo.treatment}"></p>
                                    <p th:text="'Medications: ' + ${result.diseaseInfo.medications}"></p>
                                    <p th:text="'Prevention: ' + ${result.diseaseInfo.prevention}"></p>
                                    <p th:text="'Severity: ' + ${result.diseaseInfo.severity}"></p>
                                    <p th:text="'Risk Factors: ' + ${result.diseaseInfo.riskFactors}"></p>
                                    <p th:text="'Contagious: ' + ${result.diseaseInfo.contagious}"></p>
                                    <p th:text="'Common Age Group: ' + ${result.diseaseInfo.commonAgeGroup}"></p>
                                    <p th:text="'Duration: ' + ${result.diseaseInfo.duration}"></p>
                                    <p th:text="'First Aid Advice: ' + ${result.diseaseInfo.firstAidAdvice}"></p>
                                    <p th:text="'Source of Information: ' + ${result.diseaseInfo.sourceOfInformation}"></p>

                                </div>

                            </div>
                        </div>

                        <div th:unless = "${result != null}">
                            <p class="lead">NO Disease Classified Yet</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="status-bar mt-3 p-2 bf-light rounded">
            <span th:text="${status != null} ? ${status} : 'Ready'"></span>
        </div>
    </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // JavaScript to handle image preview and show/hide the preview container
    document.addEventListener('DOMContentLoaded', function() {
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        const previewImage = document.getElementById('previewImage');

        // Check if there's already an image preview from server (after form submission)
        const serverPreview = document.querySelector('img[th\\:src]');
        if (serverPreview && serverPreview.getAttribute('th:src') !== null) {
            previewContainer.style.display = 'block';
        }

        // Handle file selection
        fileInput.addEventListener('change', function() {
            const file = this.files[0];

            if (file) {
                const reader = new FileReader();

                reader.addEventListener('load', function() {
                    previewImage.src = reader.result;
                    previewContainer.style.display = 'block';
                });

                reader.readAsDataURL(file);
            } else {
                previewContainer.style.display = 'none';
            }
        });
    });
</script>
<script src="script.js"></script>
</body>
</html>
