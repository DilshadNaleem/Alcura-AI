<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Edit Form</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }

        form {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }

        .profile-image-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        .profile-image {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #3498db;
            margin-bottom: 10px;
        }

        .image-upload {
            position: relative;
            display: inline-block;
        }

        .image-upload-label {
            background-color: #3498db;
            color: white;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .image-upload-label:hover {
            background-color: #2980b9;
        }

        .image-upload input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: 600;
            color: #2c3e50;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
            transition: border 0.3s;
        }

        input[type="text"]:focus,
        textarea:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.5);
        }

        input[readonly] {
            background-color: #f9f9f9;
            color: #777;
            cursor: not-allowed;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form-actions {
            margin-top: 30px;
            display: flex;
            justify-content: flex-end;
            gap: 15px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        .btn-primary {
            background-color: #3498db;
            color: white;
        }

        .btn-primary:hover {
            background-color: #2980b9;
        }

        .btn-secondary {
            background-color: #95a5a6;
            color: white;
        }

        .btn-secondary:hover {
            background-color: #7f8c8d;
        }

        /* Responsive design */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            form {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
<form th:action="@{/Doctor/Editform}" enctype="multipart/form-data" method="post" th:object="${doctor}">
    <input type="hidden" name="id" th:value="${doctor.uniqueId}" readonly>

    <div class="profile-image-container">
        <img th:if="${doctor.image != null}" th:src="@{'/Doctor/image/' + ${doctor.email}}"
             alt="Profile Image" class="profile-image" id="profileImage">
        <img th:unless="${doctor.image != null}" src="/path/to/default/image.jpg"
             alt="Profile Image" class="profile-image" id="profileImage">
        <div class="image-upload">
            <label for="image" class="image-upload-label">
                <i class="fas fa-camera"></i> Change Photo
            </label>
            <input type="file" id="image" name="image" accept="image/*" onchange="previewImage(this)">
        </div>
    </div>

    <label>First Name</label>
    <input type="text" name="firstName" th:value="${doctor.firstName}" required>

    <label>Last Name</label>
    <input type="text" name="lastName" th:value="${doctor.lastName}" required>

    <label>Email</label>
    <input type="text" name="email" th:value="${doctor.email}" readonly>

    <label>NIC</label>
    <input type="text" name="nic" th:value="${doctor.nic}" readonly>

    <label>Contact Number</label>
    <input type="text" name="contactNumber" th:value="${doctor.contactNumber}" required>

    <label>Created Date</label>
    <input type="text" name="createdAt" th:value="${#temporals.format(doctor.createdAt, 'yyyy-MM-dd HH:mm')}" readonly>

    <label>Specialist</label>
    <input type="text" name="specialist" th:value="${doctor.specialist}">

    <label>Specialist Info</label>
    <input type="text" name="specialist_info" th:value="${doctor.specialist_info}">

    <label>Qualification</label>
    <input type="text" name="Qualification" th:value="${doctor.Qualification}">

    <label for="government_Hospitals">Government Hospitals</label>
    <textarea name="government_Hospitals" id="government_Hospitals" th:text="${doctor.government_Hospitals}"></textarea>

    <div class="form-actions">
        <button type="button" class="btn btn-secondary" onclick="window.history.back()">Cancel</button>
        <button type="submit" class="btn btn-primary">Update Profile</button>
    </div>
</form>

<script>
    function previewImage(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();

            reader.onload = function(e) {
                document.getElementById('profileImage').src = e.target.result;
            }

            reader.readAsDataURL(input.files[0]);
        }
    }
</script>
</body>
</html>
